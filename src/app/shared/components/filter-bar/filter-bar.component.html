<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
    @if (hasActions) {
    <div class="flex flex-wrap gap-2 mb-3">
        <ng-content select="[actions]" />
    </div>
    }
    @if (hasExtras) {
    <div class="flex flex-wrap gap-4 mb-3">
        <ng-content select="[extras]" />
    </div>
    }
    <div [class]="gridClass">
        <ng-content />
        <div class="flex w-full gap-2 md:w-auto md:justify-self-end">
            <button type="button" (click)="search.emit()" [disabled]="isLoading"
                class="flex-1 px-4 py-2 bg-brand text-white rounded-xl text-sm font-medium hover:bg-brand-dark transition-colors disabled:opacity-50 md:flex-none">
                Buscar
            </button>
            <button type="button" (click)="clear.emit()" [disabled]="isLoading"
                class="flex-1 px-4 py-2 border border-gray-200 text-gray-700 rounded-xl text-sm font-medium hover:bg-gray-50 transition-colors disabled:opacity-50 md:flex-none">
                Limpiar
            </button>
        </div>
    </div>
</div>
