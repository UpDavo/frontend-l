        severity="secondary"
        (onClick)="toggleSidebar.emit()" />

    <!-- Lado derecho -->
    <div class="flex items-center gap-2">

        <!-- Usuario -->
        <div
            class="flex items-center gap-2.5 p-1.5 pr-3 rounded-lg hover:bg-gray-100 transition-colors cursor-pointer"
            (click)="toggleUserMenu($event)">
            <div class="w-8 h-8 rounded-full bg-brand flex items-center justify-center text-white text-xs font-bold uppercase shrink-0">
                {{ initials() || (fullName() | slice:0:1) || '?' }}
            </div>
            <div class="hidden sm:block text-left">
                <p class="text-sm font-medium text-gray-900 leading-tight">{{
                    fullName() }}</p>
            </div>
            <i
                class="pi pi-chevron-down text-xs text-gray-400 hidden sm:inline"></i>
        </div>

        <!-- Menú dropdown -->
        <p-menu #userMenu [model]="userMenuItems()" [popup]="true"
